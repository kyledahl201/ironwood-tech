free:
  title: Free Course
  slug: free-course
  tagline: A free course
  published: true
  position: 1
  tutor_name: Prof. Test Tutor
  rubric: "Clear and working."

other:
  title: Other Course
  slug: other-course
  tagline: Another course
  published: true
  position: 2

# A sold course. Its slug matches db/course_players/px1, so it has a player.
px1:
  title: Life and Work, With Claude
  slug: px1
  tagline: A made-up price for tests
  published: true
  paid: true
  price_cents: 2900
  position: 100

# Sold, but the owner hasn't set a price yet.
unpriced:
  title: Unpriced Course
  slug: unpriced-course
  published: true
  paid: true
  position: 101

# Classroom courses: each code's Course, so the course can be owned
# (Catalog.sync_courses! makes these from db/seeds in the real app).
<% { "tour" => ["start-here", "TOUR"], "cs090" => ["cs-090", "CS 090"], "cs101" => ["cs-101", "CS 101"], "ai360" => ["ai-360", "AI 360"],
     "gt110" => ["gt-110", "GT 110"], "js210" => ["js-210", "JS 210"], "cs330" => ["cs-330", "CS 330"], "wd110" => ["wd-110", "WD 110"] }.each_with_index do |(key, (slug, code)), i| %>
<%= key %>:
  title: <%= code %> course
  slug: <%= slug %>
  code: <%= code %>
  published: true
  position: <%= 50 + i %>
<% end %>
