<title>Life and Work, With Claude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a trail of nine stops. Sticky lesson rail on wide screens, a top strip on phones; one reading column. Ironwood brand book tokens. */
:root{
  --midnight:#14213D; --linen:#F5F3EF; --copper:#B87333; --copper-deep:#8C5727; --night:#0B1222; --ruby:#9B2335;
  --bg:#F5F3EF; --surface:#FFFFFF; --ink:#14213D; --muted:#4F5B73; --line:#DCD6CC; --soft:#ECE7DE;
  --accent:#8C5727; --accent-big:#B87333; --band:#14213D; --band-ink:#F5F3EF; --ok:#2F6B4F; --ok-bg:#E3F0E8; --bad:#9B2335; --bad-bg:#F6E3E6;
  --code-bg:#14213D; --code-ink:#F5F3EF;
  --serif:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#131D33; --ink:#EDEAE3; --muted:#A9B1C3; --line:#26324D; --soft:#1A2540;
  --accent:#D69457; --accent-big:#D69457; --band:#14213D; --band-ink:#F5F3EF; --ok:#7FC39E; --ok-bg:#163326; --bad:#E58A98; --bad-bg:#3A1A22;
  --code-bg:#060B16; --code-ink:#F5F3EF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#131D33; --ink:#EDEAE3; --muted:#A9B1C3; --line:#26324D; --soft:#1A2540;
  --accent:#D69457; --accent-big:#D69457; --band:#14213D; --band-ink:#F5F3EF; --ok:#7FC39E; --ok-bg:#163326; --bad:#E58A98; --bad-bg:#3A1A22;
  --code-bg:#060B16; --code-ink:#F5F3EF; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--copper);outline-offset:2px;border-radius:4px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
.eyebrow{font-weight:700;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
button{font:inherit;cursor:pointer}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--band);color:var(--band-ink)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-width:0}
.brand img{width:34px;height:34px;flex:none}
.brand b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.brand span{font-size:12px;opacity:.75;display:block;letter-spacing:.04em}
.topnav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.topnav a{color:var(--band-ink);text-decoration:none;font-weight:600;font-size:14.5px;padding:6px 10px;border-radius:6px}
.topnav a[aria-current="page"],.topnav a:hover{background:rgba(245,243,239,.12)}
.prog{height:4px;background:rgba(245,243,239,.15)}
.prog i{display:block;height:100%;background:var(--copper);width:0;transition:width .4s}

/* Home */
.hero{background:var(--band);color:var(--band-ink);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:44px 52px}
.hero h1{font-size:clamp(34px,5.2vw,58px);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:#E0A06A}
.hero p.lede{font-size:19px;max-width:54ch;opacity:.92;margin:16px 0 22px}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:14.5px;opacity:.85;margin-bottom:24px}
.hero .meta b{font-family:var(--mono);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:12px 18px;font-weight:700;text-decoration:none;font-size:16px}
.btn.primary{background:var(--copper);color:#14213D}
.btn.primary:hover{background:#C9834A}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.btn.line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.hero-art{min-width:0}
.section{padding-block:44px}
.section h2{font-size:clamp(26px,3.4vw,34px)}
.section .sub{color:var(--muted);max-width:62ch;margin:8px 0 26px}
.trail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stop{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:start;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.stop:hover{border-color:var(--accent);transform:translateY(-2px)}
.stop .num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:20px;background:var(--soft);color:var(--ink);border:2px solid var(--line)}
.stop.done .num{background:var(--copper);border-color:var(--copper);color:#14213D}
.stop h3{font-size:17.5px}
.stop p{margin:4px 0 0;color:var(--muted);font-size:14.5px;line-height:1.4}
.stop .mins{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.three > div{min-width:0}
.three h3{font-size:19px;margin:12px 0 4px}
.three p{margin:0;color:var(--muted)}
.three svg{width:100%;height:auto;display:block;border-radius:10px}
.fine{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-block:22px 40px}
.fine p{margin:0 0 6px;max-width:80ch}

/* Lesson layout */
.lesson-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;padding-block:28px 60px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail a{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.25}
.rail a .d{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft);border:1.5px solid var(--line)}
.rail a.done .d{background:var(--copper);border-color:var(--copper);color:#14213D}
.rail a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--copper)}
.rail .railhead{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 8px 8px}
.lesson{min-width:0;max-width:760px}
.lhead .eyebrow{display:flex;gap:12px;flex-wrap:wrap}
.lhead h1{font-size:clamp(30px,4.4vw,44px);margin:8px 0 10px}
.leave{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.leave b{white-space:nowrap;color:var(--accent)}
.walt{margin:22px 0;padding:4px 0 4px 18px;border-left:3px solid var(--copper);font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.45}
.walt small{display:block;font-family:var(--sans);font-style:normal;font-size:13px;color:var(--muted);margin-top:6px}
.idea{background:var(--band);color:var(--band-ink);border-radius:14px;overflow:hidden;margin:26px 0}
.idea .pic{background:#0F1A31;padding:14px;overflow-x:auto}
.idea .pic svg{display:block;width:100%;height:auto}
.swipe{display:none;font-size:12.5px;color:#A9B1C3;padding:6px 14px 0}
.idea .txt{padding:18px 20px 20px}
.idea h2{font-size:23px;margin-bottom:6px}
.idea p{margin:0;opacity:.92;max-width:62ch}
.video{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:15px;margin:0 0 26px}
.video .play{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start}
.step .sn{width:32px;height:32px;border-radius:50%;background:var(--midnight);color:var(--linen);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:2px}
:root[data-theme="dark"] .step .sn{background:var(--copper);color:#14213D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step .sn{background:var(--copper);color:#14213D}}
.step.note .sn{background:transparent;border:2px solid var(--copper);color:var(--accent)}
.step .body{min-width:0}
.step .body > p{margin:4px 0 8px}
.prompt{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:14px 16px 14px 16px;font-family:var(--mono);font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.prompt .lab{display:block;padding-right:84px;font-family:var(--sans);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:#E0A06A;font-weight:700;margin-bottom:6px}
.copy{position:absolute;top:8px;right:8px;background:#E0A06A;color:#14213D;border:0;border-radius:6px;padding:5px 11px;font-weight:700;font-size:13px}
.copy.ok{background:#7FC39E}
.cos{display:inline-block;margin-top:6px;font-size:13px;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 10px}
.tip{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.tip img{width:44px;height:44px}
.tip p{margin:0}
.yourturn{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px}
.yourturn .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.yourturn input{font:inherit;width:110px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.fb{font-weight:600;font-size:15px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.box{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:18px 20px;margin-top:26px}
.box h2{font-size:21px;margin-bottom:8px}
.checkline{display:flex;gap:12px;align-items:flex-start}
.checkline input{width:22px;height:22px;margin-top:3px;accent-color:#B87333;flex:none}
details.breaks{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);margin-top:14px}
details.breaks summary{padding:14px 18px;font-weight:700;cursor:pointer}
details.breaks dl{margin:0;padding:0 18px 14px}
details.breaks dt{font-weight:700;margin-top:10px}
details.breaks dd{margin:2px 0 0;color:var(--muted)}
.edge{margin-top:26px;border-radius:14px;padding:22px;background:linear-gradient(0deg,var(--soft),var(--soft));border:1.5px solid var(--line);position:relative}
.edge .eyebrow{display:flex;align-items:center;gap:8px}
.edge h2{font-size:24px;margin:6px 0 8px}
.edge p{margin:0 0 12px;max-width:64ch}
.edge .try{background:var(--surface);border-radius:10px;padding:12px 14px;border:1.5px dashed var(--copper)}
.edge .try b{color:var(--accent)}
.quiz{margin-top:26px}
.q{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 18px;margin-top:12px}
.q p.qq{margin:0 0 10px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.why{margin:10px 0 0;font-size:15px;color:var(--muted)}
.finish{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.score{font-family:var(--mono);font-size:14px;color:var(--muted)}

/* Tools */
.builder{display:grid;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px}
.builder label{font-weight:700;font-size:14.5px;display:block;margin-bottom:4px}
.builder label span{font-weight:400;color:var(--muted)}
.builder textarea{width:100%;font:inherit;font-size:15.5px;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:44px}
.meter{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.meter i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.meter i.on{background:var(--copper)}
table.data{border-collapse:collapse;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;width:100%}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.data th{font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}

/* Otters mini scoreboard (uses the Otters' own style card, on purpose) */
.ob{--river:#0F4C5C;--bolt:#FFC914;--foam:#F2F7F5;--night:#0B2027;border-radius:14px;overflow:hidden;border:2px solid var(--river);background:var(--foam);color:var(--night);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.ob header{background:var(--river);color:var(--foam);padding:14px}
.ob .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ob .t img{width:54px;height:54px}
.ob .t h4{margin:0;font:800 20px/1 "Avenir Next",-apple-system,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.ob .t small{display:block;opacity:.8;margin-top:3px}
.ob .wk{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.ob .wk button{border:2px solid var(--foam);background:transparent;color:var(--foam);border-radius:999px;padding:4px 10px;font-size:13px}
.ob .wk button[aria-pressed="true"]{background:var(--bolt);border-color:var(--bolt);color:var(--night);font-weight:700}
.ob .big{font:800 34px/1 "Avenir Next",-apple-system,sans-serif;color:var(--bolt);margin-top:12px}
.ob .bar{height:9px;background:rgba(242,247,245,.22);border-radius:9px;overflow:hidden;margin-top:8px}
.ob .bar i{display:block;height:100%;background:var(--bolt)}
.ob .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.ob .c{background:#fff;border:2px solid var(--river);border-radius:12px;padding:10px;font-size:13px}
.ob .c.hit{border-color:var(--night);box-shadow:4px 4px 0 var(--bolt)}
.ob .c b{display:block;font:800 14px/1.1 "Avenir Next",-apple-system,sans-serif;text-transform:uppercase}
.ob .c .p{font:800 26px/1 "Avenir Next",-apple-system,sans-serif;margin:6px 0 4px}
.ob .tag{display:inline-block;margin-top:6px;border-radius:999px;padding:2px 8px;font-weight:700;font-size:11.5px;background:var(--bolt)}
.ob .tag.w{background:#dfe9e6}
.ladder{display:flex;flex-direction:column-reverse;gap:8px}
.rung{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line)}
.rung .k{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--soft)}
.rung.here{border-color:var(--copper);box-shadow:inset 4px 0 0 var(--copper)}
.rung.here .k{background:var(--copper);color:#14213D}
.rung b{display:block}
.rung span{color:var(--muted);font-size:15px}
.libgroup{margin-top:26px}
.libgroup h3{font-size:19px;margin-bottom:10px}
.libgroup .prompt{margin-top:10px}
.celebrate{display:flex;gap:16px;align-items:center;background:var(--band);color:var(--band-ink);border-radius:14px;padding:18px;margin-top:20px}
.celebrate img{width:84px;height:84px;flex:none}
.celebrate p{margin:4px 0 0;opacity:.9}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;gap:24px;padding-block:30px 36px}
  .trail,.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lesson-grid{grid-template-columns:1fr;gap:12px;padding-block:14px 50px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .rail .railhead{display:none}
  .rail a{grid-template-columns:26px;padding:4px}
  .rail a .lbl{display:none}
}
@media (max-width:560px){
  .trail,.three{grid-template-columns:1fr}
  .brand span{display:none}
  .topnav a{padding:6px 7px;font-size:14px}
  .idea .pic svg{min-width:600px}
  .swipe{display:block}
}
.mh{background:#FBF9F4;color:#14213D;border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px}
.mh header{display:flex;gap:10px;align-items:center;margin-bottom:10px;position:static;background:none;border:0;padding:0}.mh header img{width:40px;height:40px}.mh h4{margin:0;font:700 17px/1.2 'Libre Caslon Text',Georgia,serif;color:#14213D}.mh small{color:#4F5B73}
.mdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.mday{background:#fff;border:1px solid #DCD6CC;border-radius:7px;padding:5px;display:flex;flex-direction:column;gap:3px;min-height:110px}.mday.busy{border:2px solid #B87333}
.mday b{font-size:12px}.mday b span{color:#4F5B73;font-weight:400}.mday i{font-style:normal;font-size:11px;line-height:1.25;background:#F5F3EF;border-radius:4px;padding:2px 4px;border-left:3px solid #B87333}.mday i.none{border:none;background:none;color:#8D97AD}
.w-Ava{border-left-color:#5B8DB8!important}.w-Milo{border-left-color:#E8B84A!important}.w-Sam{border-left-color:#4F8A6B!important}.w-Jordan{border-left-color:#9B2335!important}
.mdin{all:unset;cursor:pointer;margin-top:auto;font-size:11px;color:#8C5727;text-decoration:underline;text-underline-offset:2px;line-height:1.25}.mdin:focus-visible{outline:2px solid #B87333}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.mlist,.mbud{background:#fff;border:1px solid #DCD6CC;border-radius:8px;padding:8px 10px}.mlist label{display:block;font-size:12.5px;margin:2px 0}.mlist small{display:block;margin-top:4px}
.mbud p{margin:4px 0;font-size:12.5px;color:#14213D}.mbud .bar{height:10px;background:#E9E4DA;border-radius:5px;overflow:hidden}.mbud .bar i{display:block;height:100%;background:#4F8A6B}.mrec{color:#4F5B73!important;font-size:12px!important}
@media (max-width:700px){.mdays{grid-template-columns:repeat(2,minmax(0,1fr))}.mrow{grid-template-columns:1fr}}
</style>

<header class="top">
  <div class="wrap gut">
    <a class="brand" href="#home"><img id="crest" alt=""><div><b>Ironwood Tech</b><span>a Digital Farm and Garden company</span></div></a>
    <nav class="topnav" aria-label="Course">
      <a href="#home" data-nav="home">Course</a>
      <a href="#prompts" data-nav="prompts">Prompts</a>
      <a href="#help" data-nav="help">When it breaks</a>
    </nav>
  </div>
  <div class="prog" aria-hidden="true"><i id="progbar"></i></div>
</header>
<main id="app"></main>

<script>/*ASSETS*/</script>
<script>/*CONTENT*/</script>
<script>
(function(){
var C=window.COURSE, A=window.ASSETS, L=C.lessons;
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
$("#crest").src=A.crest;

/* ---------- per-viewer progress (convenience only) ---------- */
var KEY="iw-px1-v1", state={done:{},quiz:{},checks:{},draft:{}};
